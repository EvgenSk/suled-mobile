name: iOS CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'ios/**'
      - 'shared/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ios/**'
      - 'shared/**'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: macos-latest
    # Skip if ios directory doesn't exist
    if: ${{ hashFiles('ios/**') != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'

    - name: Install dependencies (CocoaPods)
      run: |
        cd ios
        pod install
      if: hashFiles('ios/Podfile') != ''

    - name: Build iOS App
      run: |
        cd ios
        xcodebuild -workspace SuledApp.xcworkspace -scheme SuledApp -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 15' build
      if: hashFiles('ios/*.xcworkspace') != ''

    - name: Build iOS App (without workspace)
      run: |
        cd ios
        xcodebuild -project SuledApp.xcodeproj -scheme SuledApp -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 15' build
      if: hashFiles('ios/*.xcworkspace') == ''

    - name: Run tests
      run: |
        cd ios
        xcodebuild test -scheme SuledApp -destination 'platform=iOS Simulator,name=iPhone 15'

  build-release:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Install Apple Certificate
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate from secrets
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Install provisioning profile
      env:
        PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      run: |
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

    - name: Build and Archive
      run: |
        cd ios
        xcodebuild -scheme SuledApp \
          -configuration Release \
          -archivePath $RUNNER_TEMP/SuledApp.xcarchive \
          archive

    - name: Export IPA
      run: |
        cd ios
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/SuledApp.xcarchive \
          -exportPath $RUNNER_TEMP/export \
          -exportOptionsPlist ExportOptions.plist

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: app-ipa
        path: ${{ runner.temp }}/export/SuledApp.ipa

  deploy-testflight:
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    needs: build-release
    environment:
      name: 'TestFlight'

    steps:
    - name: Download IPA
      uses: actions/download-artifact@v4
      with:
        name: app-ipa

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      run: |
        echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o AuthKey.p8
        xcrun altool --upload-app \
          --type ios \
          --file SuledApp.ipa \
          --apiKey $APP_STORE_CONNECT_API_KEY_ID \
          --apiIssuer $APP_STORE_CONNECT_ISSUER_ID
