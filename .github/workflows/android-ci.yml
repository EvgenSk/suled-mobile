name: Android CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_JSON" > android/app/app/google-services.json

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew
      working-directory: ./android/app

    - name: Build with Gradle
      run: ./gradlew build
      working-directory: ./android/app

    - name: Run tests
      run: ./gradlew test
      working-directory: ./android/app

    - name: Run lint
      run: ./gradlew lint
      working-directory: ./android/app

    - name: Build debug APK
      run: ./gradlew assembleDebug
      working-directory: ./android/app

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/app/build/outputs/apk/debug/app-debug.apk

  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: echo "$GOOGLE_SERVICES_JSON" > android/app/app/google-services.json

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo $KEYSTORE_BASE64 | base64 -d > android/app/keystore.jks

    - name: Build release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease
      working-directory: ./android/app

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/app/build/outputs/apk/release/app-release.apk

    - name: Build AAB (Android App Bundle)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew bundleRelease
      working-directory: ./android/app

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-bundle
        path: android/app/app/build/outputs/bundle/release/app-release.aab

  deploy-play-store:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-release
    environment:
      name: 'Google Play Store'

    steps:
    - name: Download AAB
      uses: actions/download-artifact@v4
      with:
        name: app-bundle

    - name: Deploy to Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.suled.app
        releaseFiles: app-release.aab
        track: internal  # or: production, beta, alpha
        status: completed
